version: 2
project_name: git-inlay

builds:
  - main: ./cmd/git-inlay
    binary: git-inlay
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    # Listing files replaces the defaults, so the license is named too. The
    # man page is what `git inlay --help` shows: git answers that itself.
    files:
      - LICENSE
      - README.md
      - man/git-inlay.1

checksum:
  name_template: checksums.txt

changelog:
  use: git
  sort: asc
  filters:
    exclude:
      - "^test"
      - "^docs"
      - "^ci"
      - "^chore"

release:
  draft: true
