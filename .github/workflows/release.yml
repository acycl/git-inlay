name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # A tag on a commit that does not pass gets no release and no provenance.
  ci:
    uses: ./.github/workflows/ci.yml

  goreleaser:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release
      id-token: write # sign the provenance with Sigstore
      attestations: write # store the provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # GoReleaser gets its token from the environment below.
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # A supported Go, not the go.mod floor, which may no longer get fixes.
          go-version: stable
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.19.0 # exact, and bumped by hand: Dependabot does not see it
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Before anything is attested: what was built is what gets vouched for.
      - name: check every archive carries the binary, the license and the man page
        run: scripts/check-archives.sh dist
      - name: smoke-test the binary from the archive
        run: scripts/smoke-archive.sh dist "${GITHUB_REF_NAME#v}"
      - name: attest the provenance of every archive in the checksums file
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt
