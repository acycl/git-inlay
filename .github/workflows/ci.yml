name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # The Go releases are built with, on every OS they ship for; the
          # oldest-git job runs on the go.mod floor.
          go-version: stable
      - run: git --version
      - run: go vet ./...
      - run: go build ./...
      # No -race: no production code starts a goroutine, and the end-to-end
      # tests run a binary built without it.
      - run: go test -count=1 ./...
      - name: end-to-end coverage
        if: runner.os == 'Linux'
        run: |
          mkdir -p "$RUNNER_TEMP/cov"
          GOCOVERDIR="$RUNNER_TEMP/cov" go test -count=1 ./internal/cli
          go tool covdata percent -i="$RUNNER_TEMP/cov"

  gofmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            printf 'not gofmt-clean:\n%s\n' "$out"
            exit 1
          fi

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      # The action's default Go, stable, is what releases are built with;
      # the go.mod floor may be a release that no longer gets fixes.
      - uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0

  oldest-git:
    name: oldest supported git
    # Pinned: the cached git binary is linked against this image's
    # libraries, and the cache key below names the image for that reason.
    runs-on: ubuntu-24.04
    env:
      GIT_VERSION: 2.40.1
      # From kernel.org's signed sha256sums.asc; change with GIT_VERSION.
      GIT_SHA256: 55511f10f3b1cdf5db4e0e3dea61819dfb67661b0507a5a2b061c70e4f87e14c
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: git-cache
        with:
          path: ~/git-${{ env.GIT_VERSION }}
          key: git-${{ env.GIT_VERSION }}-${{ env.GIT_SHA256 }}-ubuntu-24.04
      - name: build git
        if: steps.git-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libcurl4-openssl-dev libssl-dev zlib1g-dev libexpat1-dev
          curl -fsSLo "git-$GIT_VERSION.tar.gz" "https://mirrors.edge.kernel.org/pub/software/scm/git/git-$GIT_VERSION.tar.gz"
          echo "$GIT_SHA256  git-$GIT_VERSION.tar.gz" | sha256sum -c -
          tar -xzf "git-$GIT_VERSION.tar.gz"
          make -C "git-$GIT_VERSION" -j"$(nproc)" NO_TCLTK=1 NO_GETTEXT=1 NO_PERL=1 prefix="$HOME/git-$GIT_VERSION" install
      - name: use the built git
        run: echo "$HOME/git-$GIT_VERSION/bin" >> "$GITHUB_PATH"
      - run: git --version
      - run: go test -count=1 ./...

  snapshot:
    name: goreleaser snapshot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Releases build with a supported Go, not the go.mod floor.
          go-version: stable
      - name: build the release artifacts without publishing
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --snapshot --clean
      - name: check an archive carries the binary and the license
        run: |
          tar -tzf dist/git-inlay_*_linux_amd64.tar.gz | tee "$RUNNER_TEMP/contents.txt"
          grep -qx git-inlay "$RUNNER_TEMP/contents.txt"
          grep -qx LICENSE "$RUNNER_TEMP/contents.txt"
